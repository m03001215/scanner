# Public entry point for the predictor, on its own port so it does not
# interfere with the existing site on port 80.
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    auth_basic "BTC predictor";
    auth_basic_user_file /etc/nginx/btcpred.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
