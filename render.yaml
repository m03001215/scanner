# Render Blueprint: https://render.com/docs/blueprint-spec
# Free web service in Frankfurt (Binance blocks US IPs). Sleeps after 15 min idle; first hit takes ~1 min.
services:
  - type: web
    name: btc-15m-predictor
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BINANCE_BASE_URLS
        value: "https://api.binance.com,https://data-api.binance.vision"
      - key: OPENAI_API_KEY      # set the value in the Render dashboard; enables the LLM analyst (OpenAI)
        sync: false
      - key: ANTHROPIC_API_KEY   # alternative provider; leave empty if using OpenAI
        sync: false
      - key: BTCPRED_LLM_MODEL
        value: "gpt-5"
      - key: BTCPRED_LLM_EFFORT
        value: "medium"
